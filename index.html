<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <!-- default link preview. The server rewrites these (absolute URLs, and per-product details on /product/:id): see server/ogPreview.js -->
    <meta name="description" content="YN Studio — a little marketplace for little things. Shop, pay with KHQR or your wallet, and track your delivery." />
    <meta property="og:site_name" content="YN Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YN Studio" />
    <meta property="og:description" content="YN Studio — a little marketplace for little things. Shop, pay with KHQR or your wallet, and track your delivery." />
    <meta property="og:image" content="/yn-logo.png" />
    <meta name="twitter:card" content="summary" />
    <title>YN Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking the first paint (print -> all swap) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&family=Gaegu:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&family=Gaegu:wght@400;700&display=swap" /></noscript>
    <link rel="preload" as="image" href="/yn-logo.png" />
    <!-- starts downloading the last-seen first banner before React even loads (same-origin file: the CSP blocks inline scripts) -->
    <script src="/preload.js"></script>
    <style>
      /* first-paint splash: the YN logo inside a slim spinning ring. Deliberately quiet and fast:
         flat background, no entrance animation (it is on screen from the very first paint), one moving part.
         Lives OUTSIDE #root so React mounting never restarts it; main.tsx fades it out as soon as the app is ready.
         The same classes are reused for the "busy" overlay (payments, long actions). Keep BootMark() in main.tsx in sync. */
      html.ynCustomLoader #ynBoot{display:none}
      .ynBoot{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;
        background:radial-gradient(60vmax 60vmax at 50% 42%,#f3ecff 0%,#faf7ff 45%,#ffffff 100%);transition:opacity .28s ease,visibility 0s .28s}
      .ynBoot.out{opacity:0;visibility:hidden;pointer-events:none}
      .ynBootMark{position:relative;width:136px;height:136px;display:grid;place-items:center}
      .ynBootMark svg{position:absolute;inset:0;width:100%;height:100%;animation:ynSpin 1.1s linear infinite}
      .ynBootMark .track{fill:none;stroke:rgba(124,58,237,.12);stroke-width:3}
      .ynBootMark .arc{fill:none;stroke:url(#ynArcGrad);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:92 248}
      .ynBootMark img{position:relative;display:block;width:80px;height:80px;object-fit:contain;animation:ynPulse 2.2s ease-in-out infinite}
      .ynBootWord{font:700 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;padding-left:.42em;color:rgba(109,40,217,.72);animation:ynWord .5s ease .15s both}
      @keyframes ynSpin{to{transform:rotate(360deg)}}
      @keyframes ynPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes ynWord{from{opacity:0}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){.ynBootMark svg{animation-duration:3s}.ynBootMark img{animation:none}}
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="YN Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="ynBoot" class="ynBoot" aria-hidden="true"><div class="ynBootMark"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="ynArcGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><circle class="track" cx="60" cy="60" r="54"/><circle class="arc" cx="60" cy="60" r="54"/></svg><img src="/yn-logo.png" alt="" width="80" height="80" decoding="async" fetchpriority="high"/></div><div class="ynBootWord">YN STUDIO</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
