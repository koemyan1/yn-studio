<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 400" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a1e"/><stop offset=".55" stop-color="#0d1840"/><stop offset="1" stop-color="#142453"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e9dfb4" stop-opacity=".42"/><stop offset=".55" stop-color="#9fb0e0" stop-opacity=".12"/><stop offset="1" stop-color="#9fb0e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".38" cy=".34" r=".8"><stop offset="0" stop-color="#f3ebc4"/><stop offset=".7" stop-color="#d9cb92"/><stop offset="1" stop-color="#bba96e"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ea3d8" stop-opacity="0"/><stop offset="1" stop-color="#8ea3d8" stop-opacity=".22"/></linearGradient>
    <linearGradient id="fadeB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230" stop-opacity="0"/><stop offset="1" stop-color="#0a1230" stop-opacity="1"/></linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a1230" stop-opacity="1"/><stop offset="1" stop-color="#0a1230" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0a1230" stop-opacity="1"/><stop offset="1" stop-color="#0a1230" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <style>
    .w{fill:#ffc95c}
    @media (prefers-reduced-motion:no-preference){
      .f1{animation:fl 5.5s ease-in-out infinite}.f2{animation:fl 7s ease-in-out -2s infinite}.f3{animation:fl 6.2s ease-in-out -4s infinite}
      @keyframes fl{0%,100%{opacity:1}46%{opacity:1}50%{opacity:.35}54%{opacity:1}78%{opacity:.8}}
    }
  </style>
  <rect width="430" height="400" fill="url(#sky)"/>
  <g fill="#e8e2c8">
    <circle cx="36" cy="40" r="1.1" opacity=".8"/><circle cx="72" cy="22" r=".8" opacity=".6"/><circle cx="214" cy="30" r="1" opacity=".7"/><circle cx="262" cy="58" r=".9" opacity=".5"/>
    <circle cx="318" cy="24" r="1.2" opacity=".8"/><circle cx="388" cy="46" r="1" opacity=".6"/><circle cx="412" cy="90" r=".8" opacity=".5"/><circle cx="20" cy="110" r=".9" opacity=".5"/>
    <circle cx="246" cy="104" r=".8" opacity=".5"/><circle cx="188" cy="62" r=".7" opacity=".6"/><circle cx="350" cy="70" r=".8" opacity=".5"/>
  </g>
  <!-- moon -->
  <circle cx="150" cy="128" r="118" fill="url(#halo)"/>
  <circle cx="150" cy="128" r="62" fill="url(#moon)"/>
  <g fill="#a99a62" opacity=".34"><circle cx="132" cy="108" r="11"/><circle cx="170" cy="146" r="14"/><circle cx="128" cy="150" r="7"/><circle cx="176" cy="104" r="6"/><circle cx="152" cy="166" r="5"/></g>
  <path d="M60 118c30-8 56 6 92-2s52-2 62 6c-26 4-48 2-70 10-30 8-62-4-84-14z" fill="#0b1638" opacity=".5"/>
  <path d="M96 170c28-6 48 4 78-2 20-4 34 0 44 6-24 2-40 0-60 6-24 6-46-2-62-10z" fill="#0b1638" opacity=".42"/>
  <!-- pines (left) -->
  <g fill="#060b1d">
    <path d="M18 400V196l-14 6 18-34-12 4 20-40-10 3 22-44 20 44-10-3 20 40-12-4 18 34-14-6v204z"/>
    <path d="M70 400V230l-12 5 15-28-10 3 17-34-8 2 20-38 20 38-8-2 17 34-10-3 15 28-12-5v170z" opacity=".95"/>
    <path d="M-6 400V240l-10 4 14-26-8 2 16-30z" />
  </g>
  <!-- house -->
  <g transform="translate(-30 4)">
    <circle cx="352" cy="232" r="70" fill="url(#glow)" opacity=".28"/>
    <g fill="#0c1738" stroke="#2c4082" stroke-width="1.3" stroke-linejoin="round">
      <path d="M268 220L350 146 432 220z"/>
      <rect x="276" y="216" width="152" height="136"/>
      <path d="M254 176L282 98 310 176z"/><rect x="258" y="174" width="48" height="178"/>
      <path d="M388 160L414 76 440 160z"/><rect x="392" y="158" width="40" height="194"/>
      <rect x="328" y="128" width="11" height="30"/>
      <path d="M284 296h112l10 10H274z"/>
    </g>
    <g stroke="#2c4082" stroke-width="1.2" fill="none"><path d="M282 98v-14M414 76V60"/><path d="M286 306v46M312 306v46M338 306v46M364 306v46M390 306v46" stroke="#0a1233" stroke-width="3"/></g>
    <g fill="#0a1233" stroke="#1d2d63" stroke-width="1"><path d="M330 150l8-18h-2l-8 18z" opacity="0"/></g>
    <!-- windows -->
    <g filter="url(#soft)" opacity=".55"><rect x="334" y="238" width="16" height="26" rx="8" fill="#ffb93d"/><rect x="368" y="238" width="16" height="26" rx="8" fill="#ffb93d"/><rect x="276" y="196" width="12" height="20" rx="6" fill="#ffb93d"/><rect x="402" y="182" width="12" height="20" rx="6" fill="#ffb93d"/></g>
    <rect class="w f1" x="336" y="240" width="12" height="22" rx="6"/><rect class="w f2" x="370" y="240" width="12" height="22" rx="6"/>
    <rect class="w f3" x="278" y="198" width="8" height="16" rx="4"/><rect class="w f1" x="404" y="184" width="8" height="16" rx="4"/>
    <rect class="w f2" x="404" y="236" width="8" height="16" rx="4"/><rect class="w f3" x="296" y="238" width="10" height="18" rx="5"/>
    <rect class="w f1" x="348" y="320" width="9" height="20" rx="3"/><rect class="w f3" x="404" y="290" width="8" height="14" rx="4" opacity=".0"/>
    <path d="M350 164a7 7 0 0 1 14 0v10h-14z" class="w f2" opacity=".85"/>
  </g>
  <!-- bare tree in front of house -->
  <g stroke="#060b1d" fill="none" stroke-linecap="round">
    <path d="M232 400c2-60 4-96 0-140" stroke-width="7"/>
    <path d="M232 300c-14-18-30-30-52-36M232 280c18-20 32-30 54-34M232 330c-20-8-34-10-50-8M232 268c-4-18-2-34 6-52M180 264c-8-4-14-12-16-22M286 246c8-2 16-8 22-18M238 216c10-10 20-14 30-14" stroke-width="3.4"/>
    <path d="M164 242c-6-6-8-12-8-20M308 228c6-4 10-10 12-18M268 202c4-6 6-12 6-18M180 322c-8 2-14 0-20-6" stroke-width="2"/>
  </g>
  <!-- ground + fog -->
  <path d="M0 352c60-12 120-6 190-2s140 8 240-6V400H0z" fill="#060b1d"/>
  <rect x="0" y="300" width="430" height="100" fill="url(#fog)"/>
  <!-- edge fades so the picture melts into the page -->
  <rect x="0" y="0" width="46" height="400" fill="url(#fadeL)"/><rect x="384" y="0" width="46" height="400" fill="url(#fadeR)"/>
  <rect x="0" y="250" width="430" height="150" fill="url(#fadeB)"/>
</svg>
