<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My wedding guests</title>
<style>
:root{--ink:#0b2527;--deep:#103638;--gold:#d9b35f;--gold2:#f0d890;--pearl:#f3ece0;--muted:#a9c4bf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(100% 60% at 50% 0,var(--deep),var(--ink));min-height:100vh;color:var(--pearl);font:16px/1.5 system-ui,"Noto Sans Khmer",sans-serif;padding:20px 14px 60px}
main{max-width:560px;margin:0 auto}h1{color:var(--gold2);font-size:1.5rem;margin:.2em 0}h2{color:var(--gold2);margin:0 0 .3em;font-size:1.15rem}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(217,179,95,.35);border-radius:14px;padding:14px;margin:14px 0}
input,textarea{width:100%;font:inherit;color:#fff;background:#173a3c;border:1px solid #3a6;border-radius:8px;padding:10px;margin:6px 0}
button,a.b{font:inherit;background:var(--gold);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;margin:3px 3px 3px 0;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:#173a3c;color:var(--pearl);border:1px solid #3a6}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.row b{flex:1;min-width:120px;font-weight:600}.ok{color:#7fe3a0;font-size:.85rem}.muted{color:var(--muted);font-size:.9rem}
</style></head><body><main id="app"><p class="muted">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="guests.js?v=1"></script></body></html>
